name: digest

# 云端定时：每天北京时间 12:00（UTC 04:00），一天一期。
# 跑在 GitHub 的机器上，跟用户电脑开不开机无关——这是本工程的核心约束（ADR 0002）。
on:
  schedule:
    # 主时点：北京 12:00。2026-11-02 实测这个 schedule 没触发过（首次 push 到首个 cron
    # 只有 22 小时，怀疑注册延迟），因此补一个后手时点，见第二步的幂等判断。
    - cron: "0 4 * * *"
    # 后手时点：北京 13:20。此时池通常已存在，只做 --rerender，成本可忽略；
    # 只有在主时点被丢弃时它才会真正抓取。
    - cron: "20 5 * * *"
  push:
    branches: [main]
    paths:
      - "04_Project/digest/**"
      - "04_Project/site/**"
      - "04_Project/content/summaries/**"
      - ".github/workflows/digest.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch=重新抓取；rerender=只套用摘要重算（不抓取）"
        default: "fetch"
      dry_run:
        description: "只测试抓取、不写入任何内容（输入 1 开启）"
        default: ""

permissions:
  contents: write

# 同一时间只跑一个，避免两次抓取互相覆盖
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯函数测试，10 毫秒级。放进 CI 是为了它不会在三周后烂掉。
      - name: 跑单元测试
        run: python -m unittest discover -s 04_Project/tests -v

      # push 触发 = AI 层刚提交了摘要，只需重算套用，不重新抓取
      # schedule / 手动触发 = 正常抓取
      - name: 生成当期
        run: |
          if [ "${{ github.event_name }}" = "push" ] || \
             [ "${{ github.event.inputs.mode }}" = "rerender" ]; then
            echo "→ 只重算，不抓取"
            python 04_Project/digest/run.py --rerender
            exit 0
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            echo "→ 试跑模式，不写入"
            python 04_Project/digest/run.py --dry-run
            exit 0
          fi

          # 幂等：今天已经有候选池就只重算，不重复抓取。
          # 这让后手 cron、手动重试、重复投递都变成安全操作。
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ -f "04_Project/content/pools/${TODAY}.json" ]; then
            echo "→ 今天（${TODAY}）已有候选池，只重算不抓取"
            python 04_Project/digest/run.py --rerender
            exit 0
          fi

          python 04_Project/digest/run.py

      # 生成的期次必须回到 main，否则下一次构建读不到历史——
      # gh-pages 每次被整体覆盖，旧期次就丢了。
      # 用 GITHUB_TOKEN 推送不会触发新的工作流，不会自激。
      - name: 回写内容到 main
        if: github.event.inputs.dry_run != '1'
        run: |
          if [ -z "$(git status --porcelain 04_Project/content)" ]; then
            echo "→ 内容无变化"
            exit 0
          fi
          git config user.name "ai-digest"
          git config user.email "ai-digest@users.noreply.github.com"
          git add 04_Project/content
          git commit -qm "content: 自动更新期次 [skip ci]"
          git pull -q --rebase origin main
          git push -q origin main
          echo "→ 已回写 $(git log --oneline -1)"

      - name: 发布到 gh-pages
        if: github.event.inputs.dry_run != '1'
        run: |
          cd 03_OutputFiles/deliverables/site
          git init -q -b gh-pages
          git add -A
          git -c user.name="ai-digest" -c user.email="ai-digest@users.noreply.github.com" \
              commit -qm "deploy: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
