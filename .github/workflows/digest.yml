name: digest

# 云端定时：北京时间 12:00 与 18:00（UTC 04:00 / 10:00）。
# 跑在 GitHub 的机器上，跟用户电脑开不开机无关——这是本工程的核心约束（ADR 0002）。
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  push:
    branches: [main]
    paths:
      - "04_Project/digest/**"
      - "04_Project/site/**"
      - "04_Project/content/summaries/**"
      - ".github/workflows/digest.yml"
  workflow_dispatch:
    inputs:
      slot:
        description: "档位：12 或 18（留空则按当前北京时间自动判断）"
        default: ""
      dry_run:
        description: "只测试抓取、不写入任何内容（输入 1 开启）"
        default: ""

permissions:
  contents: write

# 同一时间只跑一个，避免两次抓取互相覆盖
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # push 触发 = AI 层刚提交了摘要，只需重算套用，不重新抓取
      # schedule / 手动触发 = 正常两更，按档位抓取
      - name: 生成当期
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "→ push 触发，重算套用摘要"
            python 04_Project/digest/run.py --rerender
            exit 0
          fi

          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$HOUR" -ge 15 ]; then SLOT=18; else SLOT=12; fi
          fi
          echo "→ 档位 ${SLOT}"

          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            echo "→ 试跑模式，不写入"
            python 04_Project/digest/run.py --slot "$SLOT" --dry-run
            exit 0
          fi

          python 04_Project/digest/run.py --slot "$SLOT"

      # 生成的期次必须回到 main，否则下一次构建读不到历史——
      # gh-pages 每次被整体覆盖，旧期次就丢了。
      # 用 GITHUB_TOKEN 推送不会触发新的工作流，不会自激。
      - name: 回写内容到 main
        if: github.event.inputs.dry_run != '1'
        run: |
          if [ -z "$(git status --porcelain 04_Project/content)" ]; then
            echo "→ 内容无变化"
            exit 0
          fi
          git config user.name "ai-digest"
          git config user.email "ai-digest@users.noreply.github.com"
          git add 04_Project/content
          git commit -qm "content: 自动更新期次 [skip ci]"
          git pull -q --rebase origin main
          git push -q origin main
          echo "→ 已回写 $(git log --oneline -1)"

      - name: 发布到 gh-pages
        if: github.event.inputs.dry_run != '1'
        run: |
          cd 03_OutputFiles/deliverables/site
          git init -q -b gh-pages
          git add -A
          git -c user.name="ai-digest" -c user.email="ai-digest@users.noreply.github.com" \
              commit -qm "deploy: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
